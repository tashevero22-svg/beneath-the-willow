<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beneath the Willow</title>
<style>
body{margin:0;background:#1a2210;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:Georgia, serif;}
.book{margin-top:30px;width:90%;max-width:350px;height:520px;position:relative;}
.cover{width:100%;height:100%;border-radius:12px;box-shadow:0 15px 40px rgba(0,0,0,0.6);cursor:pointer;overflow:hidden;position:relative;}
.cover img{width:100%;height:100%;object-fit:cover;display:block;}
.page{width:100%;height:100%;background:#fdf6e3;border-radius:12px;padding:25px;box-sizing:border-box;color:#3d2b1f;line-height:2;display:none;box-shadow:0 15px 40px rgba(0,0,0,0.4);background-image: repeating-linear-gradient(transparent, transparent 28px, #e7d5b3 28px, #e7d5b3 29px);}
.page.active{display:block;}
.page h2{color:#8B6914;}
.signature{text-align:right;font-style:italic;color:#8B6914;margin-top:40px;font-size:20px;}
.btns{margin:20px;display:flex;gap:15px;}
.btns button{background:#8B6914;color:#fdf6e3;border:none;padding:12px 22px;border-radius:25px;font-weight:bold;cursor:pointer;}
</style>
</head>
<body>

<div class="book">
  <!-- COVER - NOW WITH IMG TAG -->
  <div id="cover" class="cover" onclick="openBook()">
    <img src="assets/beneath-the-willow.png" alt="Beneath the Willow Cover">
  </div>

  <div id="p1" class="page">
    <h2>Dear Diary,</h2>
    <p>Beneath the willow, I find peace...</p>
    <p>This diary belongs to Tsulalu.</p>
    <div class="signature">Tsulalu</div>
  </div>

  <div id="p2" class="page">
    <p>Today I felt...</p>
    <p>Write here...</p>
    <div class="signature">Tsulalu</div>
  </div>
</div>

<div class="btns">
  <button onclick="prev()">← Prev</button>
  <button onclick="next()">Next →</button>
</div>

<script>
let page=0;
function openBook(){ document.getElementById('cover').style.display='none'; document.getElementById('p1').classList.add('active'); page=1; }
function next(){ if(page==0) openBook(); else if(page==1){ document.getElementById('p1').classList.remove('active'); document.getElementById('p2').classList.add('active'); page=2; } }
function prev(){ if(page==2){ document.getElementById('p2').classList.remove('active'); document.getElementById('p1').classList.add('active'); page=1; } else if(page==1){ document.getElementById('p1').classList.remove('active'); document.getElementById('cover').style.display='block'; page=0; } }
</script>
</body>
</html>
