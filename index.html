<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beneath the Willow</title>
<style>
body{margin:0;background:#fff;display:flex;flex-direction:column;align-items:center;min-height:100vh;font-family:Georgia, serif;}
.book-wrap{width:92%;max-width:360px;margin-top:20px;aspect-ratio:3/4.4;position:relative;display:flex;perspective:1500px;}
.pages{flex:1;margin-left:14px;position:relative;transform-style:preserve-3d;}
.cover,.page{width:100%;height:100%;position:absolute;top:0;left:0;transform-origin:left center;transition:transform 0.9s cubic-bezier(0.645, 0.045, 0.355, 1);backface-visibility:hidden;border-radius:0 14px 14px 0;box-shadow:0 2px 15px rgba(0,0,0,0.2);}
.cover{z-index:4;}
#p1{z-index:3;}
#p2{z-index:2;}
.flipped{transform:rotateY(-180deg);box-shadow:-10px 0 20px rgba(0,0,0,0.3);}
.cover img{width:100%;height:100%;object-fit:cover;border-radius:0 14px 14px 0;}
.page{background:#fdf6e3;padding:26px;box-sizing:border-box;color:#3d2b1f;line-height:2.1;display:block;}
.spine{position:absolute;left:0;top:0;bottom:0;width:16px;background:#121a0a;z-index:20;border-radius:6px 0 0 6px;display:flex;flex-direction:column;justify-content:space-between;padding:16px 0;align-items:center;}
.spine span{width:10px;height:12px;background:#000;border-radius:2px;}
.spiral{position:absolute;left:-10px;top:0;bottom:0;width:40px;display:flex;flex-direction:column;justify-content:space-between;padding:14px 0;z-index:30;pointer-events:none;}
.wire{width:38px;height:16px;position:relative;}
.wire::before,.wire::after{content:'';position:absolute;left:5px;width:26px;height:7px;border:1.6px solid #0a0a0a;border-radius:50%;background:linear-gradient(to bottom, #222, #000);}
.wire::before{top:0;}
.wire::after{top:6px;}
.btns{display:flex;gap:16px;margin-top:24px;}
.btns button{background:#8b6e1e;color:#fff3c2;border:none;padding:12px 28px;border-radius:28px;font-weight:bold;cursor:pointer;transition:0.2s;}
.btns button:active{transform:scale(0.95);}
</style>
</head>
<body>

<div class="book-wrap">
  <div class="spine"><span></span><span></span><span></span><span></span></div>
  <div class="spiral">
    <div class="wire"></div><div class="wire"></div><div class="wire"></div><div class="wire"></div><div class="wire"></div>
    <div class="wire"></div><div class="wire"></div><div class="wire"></div><div class="wire"></div><div class="wire"></div>
  </div>
  <div class="pages">
    <div id="cover" class="cover"><img src="assets/beneath-the-willow.png"></div>
    <div id="p1" class="page"><h2 style="color:#8B6914">Dear Diary,</h2><p>Beneath the willow, I find peace...</p><p style="margin-top:50px;font-style:italic;">This diary belongs to Tsulalu.</p></div>
    <div id="p2" class="page"><p><b>Date:</b> ___ / ___ / ___</p><p>Write your thoughts here...</p></div>
  </div>
</div>

<div class="btns">
  <button onclick="prev()">← Prev</button>
  <button onclick="next()">Next →</button>
</div>

<script>
let current = 0;
const pages = [document.getElementById('cover'), document.getElementById('p1'), document.getElementById('p2')];

function next(){
  if(current < pages.length){
    pages[current].classList.add('flipped');
    current++;
    updateZ();
  }
}
function prev(){
  if(current > 0){
    current--;
    pages[current].classList.remove('flipped');
    updateZ();
  }
}
function updateZ(){
  pages.forEach((p, idx) => {
    if(idx < current) p.style.zIndex = idx;
    else p.style.zIndex = pages.length - idx + 2;
  });
}
updateZ();
</script>
</body>
</html>
