<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Diary project 1.0 - Beneath the Willow</title>
<style>
  body { margin:0; background:#0e0e0e; display:flex; justify-content:center; align-items:center; min-height:100vh; font-family:monospace; }
  #cover {
    width:600px; height:900px;
    background-color:#1A4D26; /* Bg c/l = dark olive - 100% same */
    position:relative;
    box-shadow:0 0 40px rgba(0,0,0,0.8);
    overflow:hidden;
  }
  .title {
    color:#B48214; /* Text c/l = Dark Gold - 100% same */
    font-family: 'Georgia', serif;
    font-style:italic;
    font-size:48px;
    text-align:center;
    margin-top:100px;
    text-shadow:1px 1px 2px rgba(0,0,0,0.5);
  }
  .tree { position:absolute; left:50%; top:50%; transform:translate(-50%,-20%); text-align:center; }
  .trunk { width:24px; height:160px; background:#4C2D03; margin:0 auto; border-radius:8px 8px 2px 2px; } /* Doodle c/l = Brown */
  .leaves { width:380px; height:220px; background:#1B5F1A; background:radial-gradient(ellipse at center, #5A9A2A 0%, #1B5F1A 100%); border-radius:50% 50% 30% 30%; margin-top:-20px; position:relative; } /* Doodle c/l = Olive */
  .leaves:after { content:''; position:absolute; inset:10px; background:repeating-linear-gradient(90deg, transparent 0 8px, rgba(0,0,0,0.15) 8px 9px); opacity:0.3; }
  .rock { width:130px; height:55px; background:#6A6D30; background:linear-gradient(to bottom, #8A8D8E, #6A6D30); margin:20px auto 0; border-radius:30px 30px 10px 10px; position:relative; border:2px solid #4a4a3a; } /* Rock / grave 🪦 */
  .rock:after { content:'🪦'; position:absolute; top:-18px; left:50%; transform:translateX(-50%); font-size:22px; }
  .flower { position:absolute; width:10px; height:10px; background:#D1BF17; border-radius:50%; box-shadow:0 0 8px #D1BF17; } /* Tiny flowers #D1BF17 */
  .f1{ left:-30px; top:30px; } .f2{ left:20px; top:-10px; } .f3{ left:110px; top:-15px; } .f4{ left:160px; top:25px; }
  .f5{ left:-15px; top:60px; } .f6{ left:135px; top:65px; }
  .notes { position:absolute; bottom:10px; left:10px; font-size:10px; color:#98AF9C; opacity:0.7; line-height:1.4; }
</style>
</head>
<body>

<div id="cover">
  <div class="title">Beneath the Willow</div>
  
  <div class="tree">
    <div class="leaves"></div>
    <div class="trunk"></div>
    <div class="rock">
      <div class="flower f1"></div>
      <div class="flower f2"></div>
      <div class="flower f3"></div>
      <div class="flower f4"></div>
      <div class="flower f5"></div>
      <div class="flower f6"></div>
    </div>
  </div>

  <div class="notes">
    Bg c/l = dark olive #1A4D26 (raw #98AF9C)<br>
    Text c/l = Dark Gold #B48214<br>
    Doodle = Willow tree<br>
    Doodle c/l = Olive #1B5F1A / #5A9A2A, brown #4C2D03<br>
    Rock/🪦 #6A6D30 + flowers #D1BF17<br>
    Body = Willow / Foder = signature
  </div>
</div>

</body>
</html>
