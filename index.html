<!DOCTYPE html>
<html>
<head>
  <title>Beneath the Willow - Diary Customizer</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="controls">
    <h2>Diary project 1.0.png - Customize</h2>
    <label>Bg c/l = dark olive <input type="color" id="bg" value="#1A4D26"></label>
    <label>Text c/l = Dark Gold <input type="color" id="text" value="#B48214"></label>
    <label>Doodle c/l = Olive <input type="color" id="leaf" value="#5A9A2A"></label>
    <label>Doodle c/l = Brown <input type="color" id="trunk" value="#4C2D03"></label>
    <label>Rock / Grave <input type="color" id="rock" value="#8A8D8E"></label>
    <label>Tiny Flowers <input type="color" id="flower" value="#D1BF17"></label>
    <label>Title <input type="text" id="title" value="Beneath the Willow"></label>
    <button onclick="download()">Download Cover</button>
  </div>
  <canvas id="cover" width="600" height="900"></canvas>
  <script src="script.js"></script>
</body>
</html>
